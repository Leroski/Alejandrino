import groovy.json.JsonOutput

plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'cl.alejandrino.nativeapp'
    compileSdk 35
    defaultConfig {
        applicationId 'cl.alejandrino.nativeapp'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '0.5.1-capture-fixes'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters (project.hasProperty('EMULATOR_TEST') ? 'x86_64' : 'arm64-v8a') }
        buildConfigField 'String', 'ALEJANDRINO_WEB_URL', JsonOutput.toJson(project.findProperty('ALEJANDRINO_WEB_URL') ?: '')
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.check' }
        release {
            applicationIdSuffix '.check'
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pip { install 'yt-dlp==2026.10.26' }
    }
}

dependencies {
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-min:8.1.9'
    implementation 'com.arthenica:smart-exception-java:0.2.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
