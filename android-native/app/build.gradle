import groovy.json.JsonOutput

plugins { id 'com.android.application' }

android {
    namespace 'cl.alejandrino.nativeapp'
    compileSdk 35
    defaultConfig {
        applicationId 'cl.alejandrino.nativeapp'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.3.0-check'
        buildConfigField 'String', 'ALEJANDRINO_WEB_URL', JsonOutput.toJson(project.findProperty('ALEJANDRINO_WEB_URL') ?: '')
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.check' }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
