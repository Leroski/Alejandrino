import groovy.json.JsonOutput

plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'cl.alejandrino.nativeapp'
    compileSdk 35
    defaultConfig {
        applicationId 'cl.alejandrino.nativeapp'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '0.4.0-media'
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField 'String', 'ALEJANDRINO_WEB_URL', JsonOutput.toJson(project.findProperty('ALEJANDRINO_WEB_URL') ?: '')
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.check' }
        release {
            applicationIdSuffix '.check'
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.10'
        pip { install 'yt-dlp==2026.8.19' }
    }
}

dependencies {
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-min:8.1.9'
    implementation 'com.arthenica:smart-exception-java:0.2.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
