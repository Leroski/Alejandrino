plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'cl.alejandrino.nativeapp'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.alejandrino.nativeapp'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.2.0'
        buildConfigField 'String', 'ALEJANDRINO_WEB_URL', '\"' + (project.findProperty('ALEJANDRINO_WEB_URL') ?: '') + '\"'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.10'
        pip {
            install 'yt-dlp==2026.8.19'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    // LGPL-3.0: revisar obligaciones de distribución antes de publicar.
    // 8.1.9 corrige el cierre de la variante min por libc++_shared.so faltante.
    // FFmpeg queda dentro de la APK: no depende de Termux ni de servicios de descarga.
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-min:8.1.9'
    // El A07 falló con NoClassDefFoundError: com.arthenica.smartexception.java.Exceptions.
    // Declararla explícitamente asegura su inclusión en el APK.
    implementation 'com.arthenica:smart-exception-java:0.2.1'
}
