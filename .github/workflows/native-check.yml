name: Authenticated native media

on:
  push:
    branches: [main]
    paths: ['android-native/**', 'app/**', 'tests/**', 'scripts/**', 'next.config.ts', 'package*.json', '.github/workflows/native-check.yml']
  pull_request:
    paths: ['android-native/**', 'app/**', 'tests/**', 'scripts/**', 'next.config.ts', 'package*.json', '.github/workflows/native-check.yml']
  workflow_dispatch:
    inputs:
      web_origin:
        description: 'Origen HTTPS público con CHECK, DOWNLOAD y OPEN, sin tokens ni parámetros'
        required: true
        type: string
        default: 'https://proyalejandrino.vercel.app'

permissions:
  contents: read

concurrency:
  group: native-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.cjs
      - run: npx eslint app
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify preview UI with synthetic accounts and native responses
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
          NEXT_TELEMETRY_DISABLED: '1'
          PREVIEW_QA_OUTPUT: /tmp/preview-qa
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3015 > /tmp/preview-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3015/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser/preview.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-ui-fixtures
          path: /tmp/preview-qa
          retention-days: 5
          if-no-files-found: ignore

  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate synthetic video and audio for Android tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          bash scripts/create-media-test-fixtures.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Python, native FFmpeg, playback and MediaStore on Android
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          script: gradle -p android-native :app:connectedDebugAndroidTest -PEMULATOR_TEST -PALEJANDRINO_WEB_URL=https://proyalejandrino.vercel.app --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-api-${{ matrix.api-level }}
          path: |
            android-native/app/build/reports/androidTests/connected
            android-native/app/build/outputs/androidTest-results/connected
          retention-days: 5
          if-no-files-found: ignore

  android:
    needs: android-runtime
    runs-on: ubuntu-latest
    env:
      WEB_ORIGIN: ${{ inputs.web_origin || 'https://proyalejandrino.vercel.app' }}
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test bounded extraction without contacting providers
        run: |
          python -m pip install 'yt-dlp==2026.10.26'
          python -m unittest discover -s ../tests/python -v
      - name: Verify deployed origin before distributing an APK
        if: github.event_name == 'workflow_dispatch'
        run: node ../scripts/check-apk-origin.cjs "$WEB_ORIGIN" --media
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check the UUID validator used by this APK
        run: bash ../scripts/check-native-uuid.sh
      - name: Test, lint and build the media APK
        run: >-
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace
          "-PALEJANDRINO_WEB_URL=$WEB_ORIGIN"
      - name: Wait for public production before distributing an APK
        if: github.event_name == 'push'
        run: |
          for attempt in {1..18}; do
            if node ../scripts/check-apk-origin.cjs "$WEB_ORIGIN" --media; then
              exit 0
            fi
            if [ "$attempt" -lt 18 ]; then sleep 10; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: alejandrino-media-unsigned
          path: android-native/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
